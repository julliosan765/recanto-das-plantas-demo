name: Manter catálogo Supabase ativo

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activity-check:
    name: Registrar atividade diária
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Registrar leitura segura do catálogo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/products?select=id&is_active=eq.true&is_available=eq.true&price_cents=not.is.null&limit=1" \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY"
